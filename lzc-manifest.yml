application:
  subdomain: mailpit
  multi_instance: false
  upstreams:
    - location: /package-licenses/
      backend: file:///lzcapp/pkg/content/licenses/
    - location: /
      backend: http://mailpit:8025/
services:
  mailpit:
    # upstream: axllent/mailpit:v1.33.0
    image: docker.1ms.run/axllent/mailpit:v1.33.0
    environment:
      - MP_MAX_MESSAGES=5000
      - MP_DATABASE=/data/mailpit.db
      - TZ=Asia/Shanghai
    binds:
      - /lzcapp/var/data:/data
usage: |
  Mailpit 是邮件测试工具：接收你应用发出的测试邮件，在网页里查看、搜索、转发，避免误发给真实用户。

  使用方法：
  1. 打开应用就能看到收件箱界面，无需登录。
  2. 把你的应用 SMTP 指向本应用的地址，端口 1025（无需认证、不加密，仅供内网测试）。
  3. 应用发出的邮件会出现在收件箱里，可查看 HTML/源码、附件和链接。

  数据与安全：
  - 收到的邮件保存在 /lzcapp/var/data 下的 SQLite 数据库里，最多保留 5000 封，超出会自动清理旧邮件。
  - 本应用没有任何账号体系，也刻意不做认证：它是开发测试工具，请只在内网/可信环境使用，不要暴露到公网。
  - 应用经懒猫入口鉴权访问。

  说明：
  - SMTP 端口 1025 供容器网络内的其他应用投递邮件使用，不通过网页入口暴露。
  - 未做真机验证：邮件投递、收件箱浏览、搜索、转发以及重启后持久化均未在设备上实测。
